# ============================================================
# AI Skills Platform - Nginx 生产配置
# 用途：托管前端静态资源 + 反向代理后端 API（含 SSE 流式）
# 部署路径参考：/etc/nginx/conf.d/aiskills.conf
# ============================================================

server {
    listen 80;
    server_name your-domain.com;          # 改成你的域名或服务器 IP

    # 前端静态资源（npm run build 产物 frontend/dist）
    root /var/www/aiskills/dist;
    index index.html;

    # 前端 history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（带 hash 的构建产物）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反向代理 → Uvicorn (127.0.0.1:8008)
    location /api/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
    }

    # API 文档（可选用独立路径或加访问控制）
    location /docs {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 上传/输出文件（如后端通过接口下载，无需此块；仅当直接暴露静态文件时启用）
    # location /files/ {
    #     alias /var/www/aiskills/backend/uploads/;
    #     add_header Content-Disposition "inline";
    # }

    # 上传大小限制（知识库文档）
    client_max_body_size 50m;
}

