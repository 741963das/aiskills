<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技能预览与调试</title>
    <style id="theme-vars">
/* AI Skills Education Platform — Brand Tokens */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');

:root {
  /* Brand primary — Indigo */
  --ai-50: #EEF2FF;
  --ai-100: #E0E7FF;
  --ai-200: #C7D2FE;
  --ai-300: #A5B4FC;
  --ai-400: #818CF8;
  --ai-500: #6366F1;
  --ai-600: #4F46E5;
  --ai-700: #4338CA;
  --ai-800: #3730A3;
  --ai-900: #312E81;

  /* Brand accent — Cyan */
  --ai-cyan-50: #ECFEFF;
  --ai-cyan-100: #CFFAFE;
  --ai-cyan-200: #A5F3FC;
  --ai-cyan-300: #67E8F9;
  --ai-cyan-400: #22D3EE;
  --ai-cyan-500: #06B6D4;
  --ai-cyan-600: #0891B2;
  --ai-cyan-700: #0E7490;

  /* Neutral */
  --ai-slate-50: #F8FAFC;
  --ai-slate-100: #F1F5F9;
  --ai-slate-200: #E2E8F0;
  --ai-slate-300: #CBD5E1;
  --ai-slate-400: #94A3B8;
  --ai-slate-500: #64748B;
  --ai-slate-600: #475569;
  --ai-slate-700: #334155;
  --ai-slate-800: #1E293B;
  --ai-slate-900: #0F172A;

  /* Semantic aliases */
  --ai-background: var(--ai-slate-50);
  --ai-foreground: var(--ai-slate-900);
  --ai-card: #FFFFFF;
  --ai-card-foreground: var(--ai-slate-900);
  --ai-popover: #FFFFFF;
  --ai-popover-foreground: var(--ai-slate-900);
  --ai-primary: var(--ai-600);
  --ai-primary-foreground: #FFFFFF;
  --ai-muted: var(--ai-slate-100);
  --ai-muted-foreground: var(--ai-slate-500);
  --ai-border: var(--ai-slate-200);
  --ai-input: var(--ai-slate-200);
  --ai-ring: var(--ai-500);

  /* Radius aliases */
  --ai-radius-small: var(--radius-sm);
  --ai-radius-medium: var(--radius-md);
  --ai-radius-large: var(--radius-lg);

  /* State colors */
  --state-success: #059669;
  --state-success-bg: #ECFDF5;
  --state-warning: #D97706;
  --state-warning-bg: #FFFBEB;
  --state-error: #DC2626;
  --state-error-bg: #FEF2F2;
  --state-info: var(--ai-cyan-600);
  --state-info-bg: var(--ai-cyan-50);

  /* Radius */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 9999px;

  /* Typography */
  --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', monospace;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.06), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
}

/* Typography classes */
.font-sans { font-family: var(--font-sans); }
.font-mono { font-family: var(--font-mono); }

.text-display { font-size: 28px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; }
.text-h1 { font-size: 24px; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; }
.text-h2 { font-size: 20px; line-height: 1.35; font-weight: 600; }
.text-h3 { font-size: 16px; line-height: 1.4; font-weight: 600; }
.text-body { font-size: 14px; line-height: 1.6; font-weight: 400; }
.text-small { font-size: 13px; line-height: 1.5; font-weight: 400; }
.text-caption { font-size: 12px; line-height: 1.4; font-weight: 500; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--ai-background);
    --color-foreground: var(--ai-foreground);
    --color-card: var(--ai-card);
    --color-card-foreground: var(--ai-card-foreground);
    --color-popover: var(--ai-popover);
    --color-popover-foreground: var(--ai-popover-foreground);
    --color-primary: var(--ai-primary);
    --color-primary-foreground: var(--ai-primary-foreground);
    --color-muted: var(--ai-muted);
    --color-muted-foreground: var(--ai-muted-foreground);
    --color-border: var(--ai-border);
    --color-input: var(--ai-input);
    --color-ring: var(--ai-ring);
    --radius-sm: var(--ai-radius-small);
    --radius-md: var(--ai-radius-medium);
    --radius-lg: var(--ai-radius-large);
  }
  @layer base {
    body { background: var(--ai-background); color: var(--ai-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--ai-background); }
      .text-background { color: var(--ai-background); }
      .border-background { border-color: var(--ai-background); }
      .ring-background { --tw-ring-color: var(--ai-background); }
      .bg-foreground { background-color: var(--ai-foreground); }
      .text-foreground { color: var(--ai-foreground); }
      .border-foreground { border-color: var(--ai-foreground); }
      .ring-foreground { --tw-ring-color: var(--ai-foreground); }
      .bg-card { background-color: var(--ai-card); }
      .text-card { color: var(--ai-card); }
      .border-card { border-color: var(--ai-card); }
      .ring-card { --tw-ring-color: var(--ai-card); }
      .bg-card-foreground { background-color: var(--ai-card-foreground); }
      .text-card-foreground { color: var(--ai-card-foreground); }
      .border-card-foreground { border-color: var(--ai-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--ai-card-foreground); }
      .bg-popover { background-color: var(--ai-popover); }
      .text-popover { color: var(--ai-popover); }
      .border-popover { border-color: var(--ai-popover); }
      .ring-popover { --tw-ring-color: var(--ai-popover); }
      .bg-popover-foreground { background-color: var(--ai-popover-foreground); }
      .text-popover-foreground { color: var(--ai-popover-foreground); }
      .border-popover-foreground { border-color: var(--ai-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--ai-popover-foreground); }
      .bg-primary { background-color: var(--ai-primary); }
      .text-primary { color: var(--ai-primary); }
      .border-primary { border-color: var(--ai-primary); }
      .ring-primary { --tw-ring-color: var(--ai-primary); }
      .bg-primary-foreground { background-color: var(--ai-primary-foreground); }
      .text-primary-foreground { color: var(--ai-primary-foreground); }
      .border-primary-foreground { border-color: var(--ai-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--ai-primary-foreground); }
      .bg-muted { background-color: var(--ai-muted); }
      .text-muted { color: var(--ai-muted); }
      .border-muted { border-color: var(--ai-muted); }
      .ring-muted { --tw-ring-color: var(--ai-muted); }
      .bg-muted-foreground { background-color: var(--ai-muted-foreground); }
      .text-muted-foreground { color: var(--ai-muted-foreground); }
      .border-muted-foreground { border-color: var(--ai-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--ai-muted-foreground); }
      .bg-border { background-color: var(--ai-border); }
      .text-border { color: var(--ai-border); }
      .border-border { border-color: var(--ai-border); }
      .ring-border { --tw-ring-color: var(--ai-border); }
      .bg-input { background-color: var(--ai-input); }
      .text-input { color: var(--ai-input); }
      .border-input { border-color: var(--ai-input); }
      .ring-input { --tw-ring-color: var(--ai-input); }
      .bg-ring { background-color: var(--ai-ring); }
      .text-ring { color: var(--ai-ring); }
      .border-ring { border-color: var(--ai-ring); }
      .ring-ring { --tw-ring-color: var(--ai-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body data-node-id="page-skill-preview">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <!-- Shared project shell: fixed sidebar + scrollable main area -->
  <div class="font-sans min-h-screen flex bg-[var(--ai-background)] text-[var(--ai-foreground)]">

    <!-- Left sidebar -->
    <aside id="sidebar" class="fixed top-0 left-0 z-20 h-screen w-60 bg-[var(--ai-card)] border-r border-[var(--ai-border)] flex flex-col" style="box-shadow: var(--shadow-sm);">
      <nav class="flex-1 overflow-y-auto py-5 px-3 space-y-1">
        <a id="nav-dashboard" data-dom-id="nav-dashboard" href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-[var(--radius-md)] text-sm font-medium text-[var(--ai-muted-foreground)] hover:bg-[var(--ai-muted)] hover:text-[var(--ai-foreground)] transition-colors">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span>工作台</span>
        </a>
        <a id="nav-my-agents" href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-[var(--radius-md)] text-sm font-semibold bg-[var(--ai-50)] text-[var(--ai-primary)] border-l-4 border-[var(--ai-primary)] hover:bg-[var(--ai-100)] transition-colors">
          <i data-lucide="bot" class="w-5 h-5"></i>
          <span>我的助手</span>
        </a>
        <a id="nav-knowledge" data-dom-id="nav-knowledge" href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-[var(--radius-md)] text-sm font-medium text-[var(--ai-muted-foreground)] hover:bg-[var(--ai-muted)] hover:text-[var(--ai-foreground)] transition-colors">
          <i data-lucide="book-open" class="w-5 h-5"></i>
          <span>知识库</span>
        </a>
        <a id="nav-marketplace" href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-[var(--radius-md)] text-sm font-medium text-[var(--ai-muted-foreground)] hover:bg-[var(--ai-muted)] hover:text-[var(--ai-foreground)] transition-colors">
          <i data-lucide="store" class="w-5 h-5"></i>
          <span>助手市场</span>
        </a>
        <a id="nav-analytics" href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-[var(--radius-md)] text-sm font-medium text-[var(--ai-muted-foreground)] hover:bg-[var(--ai-muted)] hover:text-[var(--ai-foreground)] transition-colors">
          <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
          <span>数据分析</span>
        </a>
      </nav>
    </aside>

    <!-- Main wrapper -->
    <div class="flex-1 flex flex-col ml-60">

      <!-- Top header -->
      <header id="top-header" class="fixed top-0 right-0 left-60 z-10 h-16 bg-[var(--ai-card)] border-b border-[var(--ai-border)] flex items-center justify-between px-6" style="box-shadow: var(--shadow-sm);">
        <!-- Logo -->
        <div class="flex items-center gap-2 w-60 shrink-0">
          <div class="w-8 h-8 rounded-[var(--radius-md)] bg-[var(--ai-primary)] flex items-center justify-center text-[var(--ai-primary-foreground)]">
            <i data-lucide="sparkles" class="w-5 h-5"></i>
          </div>
          <span class="text-lg font-bold text-[var(--ai-foreground)] tracking-tight">AI Skills</span>
        </div>

        <!-- Search -->
        <div class="flex-1 max-w-2xl px-6">
          <div class="relative">
            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[var(--ai-muted-foreground)]"></i>
            <input type="text" placeholder="搜索课程、助手或知识点" class="w-full h-10 pl-10 pr-4 bg-[var(--ai-muted)] border border-[var(--ai-border)] rounded-[var(--radius-lg)] text-sm text-[var(--ai-foreground)] placeholder:text-[var(--ai-muted-foreground)] focus:outline-none focus:ring-2 focus:ring-[var(--ai-ring)] focus:border-transparent transition-all" />
          </div>
        </div>

        <!-- Right actions -->
        <div class="flex items-center gap-4 shrink-0">
          <button type="button" class="relative w-10 h-10 rounded-[var(--radius-md)] hover:bg-[var(--ai-muted)] flex items-center justify-center text-[var(--ai-muted-foreground)] transition-colors" aria-label="通知">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-[var(--ai-primary)] border-2 border-[var(--ai-card)]"></span>
          </button>

          <div class="flex items-center gap-3 pl-4 border-l border-[var(--ai-border)]">
            <div class="w-9 h-9 rounded-full bg-[var(--ai-primary)] text-[var(--ai-primary-foreground)] flex items-center justify-center text-sm font-semibold">
              张
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm font-medium text-[var(--ai-foreground)]">张教授</span>
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-[var(--ai-muted)] text-[var(--ai-muted-foreground)] border border-[var(--ai-border)]">
                教师
              </span>
            </div>
          </div>
        </div>
      </header>

      <!-- Main content area -->
      <main class="flex-1 pt-16 min-h-screen overflow-y-auto">
        <div class="max-w-7xl mx-auto px-6 py-6">

          <!-- Page title area -->
          <div class="mb-6 flex items-end justify-between gap-4">
            <div>
              <h1 class="text-h1 text-[var(--ai-foreground)]">技能预览与调试</h1>
              <p class="text-body text-[var(--ai-muted-foreground)] mt-1">高中物理力学助手 · 调试模式</p>
            </div>
            <button id="publish-btn" data-dom-id="publish-btn" type="button" class="inline-flex items-center gap-2 px-5 h-10 rounded-[var(--radius-md)] bg-[var(--ai-primary)] text-[var(--ai-primary-foreground)] text-sm font-semibold hover:bg-[var(--ai-700)] transition-colors">
              <i data-lucide="rocket" class="w-4 h-4"></i>
              发布助手
            </button>
          </div>

          <!-- Main page content -->
          <div class="flex h-[calc(100vh-13rem)] bg-[var(--ai-card)] border border-[var(--ai-border)] rounded-[var(--radius-lg)] overflow-hidden" style="box-shadow: var(--shadow-md);">

            <!-- Left config panel -->
            <aside id="config-panel" class="w-[260px] flex flex-col border-r border-[var(--ai-border)] bg-[var(--ai-slate-50)] transition-all">
              <div class="h-14 flex items-center justify-between px-4 border-b border-[var(--ai-border)]">
                <span class="text-h3 text-[var(--ai-foreground)]">调试配置</span>
                <button id="config-toggle" type="button" class="w-8 h-8 rounded-[var(--radius-md)] hover:bg-[var(--ai-slate-200)] flex items-center justify-center text-[var(--ai-muted-foreground)] transition-colors" aria-label="收起配置">
                  <i data-lucide="panel-left-close" class="w-4 h-4"></i>
                </button>
              </div>
              <div id="config-body" class="flex-1 overflow-y-auto p-4 space-y-5">

                <!-- Model selector -->
                <div>
                  <label class="text-caption text-[var(--ai-muted-foreground)] mb-1.5 block">模型</label>
                  <div class="relative">
                    <select class="w-full h-10 pl-3 pr-9 bg-[var(--ai-card)] border border-[var(--ai-border)] rounded-[var(--radius-md)] text-sm text-[var(--ai-foreground)] focus:outline-none focus:ring-2 focus:ring-[var(--ai-ring)] appearance-none">
                      <option selected>DeepSeek-V3.2</option>
                      <option>GPT-4o</option>
                      <option>Claude 3.5 Sonnet</option>
                    </select>
                    <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[var(--ai-muted-foreground)] pointer-events-none"></i>
                  </div>
                </div>

                <!-- Temperature slider -->
                <div>
                  <div class="flex items-center justify-between mb-1.5">
                    <label class="text-caption text-[var(--ai-muted-foreground)]">Temperature</label>
                    <span class="text-caption font-mono text-[var(--ai-primary)]">0.7</span>
                  </div>
                  <input type="range" min="0" max="2" step="0.1" value="0.7" class="w-full accent-[var(--ai-primary)]" />
                </div>

                <!-- Toggles -->
                <div class="space-y-3">
                  <div class="flex items-center justify-between">
                    <span class="text-body text-[var(--ai-foreground)]">知识库检索</span>
                    <button type="button" class="w-11 h-6 rounded-full bg-[var(--ai-primary)] relative transition-colors" aria-pressed="true">
                      <span class="absolute right-1 top-1 w-4 h-4 rounded-full bg-[var(--ai-primary-foreground)] shadow-sm"></span>
                    </button>
                  </div>
                  <div class="flex items-center justify-between">
                    <span class="text-body text-[var(--ai-foreground)]">经验注入</span>
                    <button type="button" class="w-11 h-6 rounded-full bg-[var(--ai-primary)] relative transition-colors" aria-pressed="true">
                      <span class="absolute right-1 top-1 w-4 h-4 rounded-full bg-[var(--ai-primary-foreground)] shadow-sm"></span>
                    </button>
                  </div>
                </div>

                <!-- Reset button -->
                <button type="button" class="w-full h-10 border border-[var(--ai-border)] rounded-[var(--radius-md)] text-sm font-medium text-[var(--ai-muted-foreground)] hover:bg-[var(--ai-muted)] hover:text-[var(--ai-foreground)] transition-colors flex items-center justify-center gap-2">
                  <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                  重置
                </button>
              </div>
            </aside>

            <!-- Chat area -->
            <section class="flex-1 min-w-0 flex flex-col bg-[var(--ai-background)]">

              <!-- Conversation stream -->
              <div id="chat-stream" class="flex-1 overflow-y-auto p-6 space-y-6">

                <!-- Welcome assistant message -->
                <div class="flex gap-3">
                  <div class="w-9 h-9 rounded-full bg-[var(--ai-primary)] text-[var(--ai-primary-foreground)] flex items-center justify-center shrink-0">
                    <i data-lucide="bot" class="w-5 h-5"></i>
                  </div>
                  <div class="max-w-[85%]">
                    <div class="bg-[var(--ai-card)] border border-[var(--ai-border)] rounded-[var(--radius-lg)] rounded-tl-none px-4 py-3" style="box-shadow: var(--shadow-sm);">
                      <p class="text-body text-[var(--ai-foreground)]">你好！我是高中物理力学助手，专门帮你理解运动学、牛顿定律、能量与动量等问题。你可以试着问我：</p>
                    </div>
                    <div class="flex flex-wrap gap-2 mt-2">
                      <button type="button" class="px-3 py-1.5 rounded-full border border-[var(--ai-border)] bg-[var(--ai-card)] text-sm text-[var(--ai-muted-foreground)] hover:border-[var(--ai-primary)] hover:text-[var(--ai-primary)] transition-colors">动量守恒的条件是什么？</button>
                      <button type="button" class="px-3 py-1.5 rounded-full border border-[var(--ai-border)] bg-[var(--ai-card)] text-sm text-[var(--ai-muted-foreground)] hover:border-[var(--ai-primary)] hover:text-[var(--ai-primary)] transition-colors">如何分析斜面受力？</button>
                      <button type="button" class="px-3 py-1.5 rounded-full border border-[var(--ai-border)] bg-[var(--ai-card)] text-sm text-[var(--ai-muted-foreground)] hover:border-[var(--ai-primary)] hover:text-[var(--ai-primary)] transition-colors">圆周运动向心力公式</button>
                    </div>
                  </div>
                </div>

                <!-- User message -->
                <div class="flex gap-3 justify-end">
                  <div class="max-w-[80%]">
                    <div class="bg-[var(--ai-primary)] text-[var(--ai-primary-foreground)] rounded-[var(--radius-lg)] rounded-tr-none px-4 py-3" style="box-shadow: var(--shadow-sm);">
                      <p class="text-body">如何用动量定理解释碰撞问题？</p>
                    </div>
                  </div>
                  <div class="w-9 h-9 rounded-full bg-[var(--ai-cyan-600)] text-white flex items-center justify-center shrink-0 text-sm font-semibold">
                    我
                  </div>
                </div>

                <!-- Assistant message with citations -->
                <div class="flex gap-3">
                  <div class="w-9 h-9 rounded-full bg-[var(--ai-primary)] text-[var(--ai-primary-foreground)] flex items-center justify-center shrink-0">
                    <i data-lucide="bot" class="w-5 h-5"></i>
                  </div>
                  <div class="max-w-[85%] space-y-3">
                    <div class="bg-[var(--ai-card)] border border-[var(--ai-border)] rounded-[var(--radius-lg)] rounded-tl-none px-4 py-3" style="box-shadow: var(--shadow-sm);">
                      <p class="text-body text-[var(--ai-foreground)] mb-2">动量定理指出：物体动量的变化等于它所受合外力的冲量，即 <span class="font-mono text-[var(--ai-primary)]">Δp = F·Δt</span>。在碰撞问题中，如果系统所受合外力为零或远小于内力，可近似认为系统总动量守恒。</p>
                      <p class="text-body text-[var(--ai-foreground)]">处理碰撞时通常先选正方向，再分别列碰撞前后动量方程，结合能量关系（弹性/非弹性）求解速度、冲量或平均作用力。</p>
                    </div>

                    <!-- Source citations -->
                    <div class="space-y-2">
                      <p class="text-caption text-[var(--ai-muted-foreground)] flex items-center gap-1">
                        <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
                        参考来源
                      </p>
                      <div class="flex flex-wrap gap-2">
                        <button type="button" class="flex items-center gap-2 px-3 py-2 rounded-[var(--radius-md)] bg-[var(--ai-slate-100)] border border-[var(--ai-border)] hover:border-[var(--ai-primary)] transition-colors">
                          <i data-lucide="file-text" class="w-4 h-4 text-[var(--ai-primary)]"></i>
                          <span class="text-small text-[var(--ai-foreground)]">力学讲义.pdf</span>
                          <span class="text-caption text-[var(--ai-muted-foreground)]">P.42</span>
                        </button>
                        <button type="button" class="flex items-center gap-2 px-3 py-2 rounded-[var(--radius-md)] bg-[var(--ai-slate-100)] border border-[var(--ai-border)] hover:border-[var(--ai-primary)] transition-colors">
                          <i data-lucide="file-text" class="w-4 h-4 text-[var(--ai-primary)]"></i>
                          <span class="text-small text-[var(--ai-foreground)]">高考真题集.pdf</span>
                          <span class="text-caption text-[var(--ai-muted-foreground)]">P.128</span>
                        </button>
                      </div>
                    </div>

                    <!-- Feedback row -->
                    <div class="flex items-center gap-2">
                      <button id="feedback-good" type="button" class="w-8 h-8 rounded-[var(--radius-md)] border border-[var(--ai-border)] text-[var(--ai-muted-foreground)] hover:text-[var(--state-success)] hover:border-[var(--state-success)] hover:bg-[var(--state-success-bg)] flex items-center justify-center transition-colors" aria-label="有用">
                        <i data-lucide="thumbs-up" class="w-4 h-4"></i>
                      </button>
                      <button id="feedback-bad" type="button" class="w-8 h-8 rounded-[var(--radius-md)] border border-[var(--ai-border)] text-[var(--ai-muted-foreground)] hover:text-[var(--state-error)] hover:border-[var(--state-error)] hover:bg-[var(--state-error-bg)] flex items-center justify-center transition-colors" aria-label="无用">
                        <i data-lucide="thumbs-down" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Bottom input bar -->
              <div class="p-4 border-t border-[var(--ai-border)] bg-[var(--ai-card)]">
                <div class="flex items-end gap-3 max-w-4xl mx-auto">
                  <button type="button" class="w-10 h-10 rounded-[var(--radius-md)] border border-[var(--ai-border)] text-[var(--ai-muted-foreground)] hover:text-[var(--ai-foreground)] hover:bg-[var(--ai-muted)] flex items-center justify-center transition-colors" aria-label="附件">
                    <i data-lucide="paperclip" class="w-5 h-5"></i>
                  </button>
                  <div class="flex-1 relative">
                    <textarea id="chat-input" rows="1" placeholder="输入消息测试助手..." class="w-full min-h-[44px] max-h-32 pl-4 pr-12 py-2.5 bg-[var(--ai-muted)] border border-[var(--ai-border)] rounded-[var(--radius-lg)] text-sm text-[var(--ai-foreground)] placeholder:text-[var(--ai-muted-foreground)] focus:outline-none focus:ring-2 focus:ring-[var(--ai-ring)] resize-none"></textarea>
                  </div>
                  <button id="send-btn" type="button" class="w-10 h-10 rounded-[var(--radius-md)] bg-[var(--ai-primary)] text-[var(--ai-primary-foreground)] hover:bg-[var(--ai-700)] flex items-center justify-center transition-colors" aria-label="发送">
                    <i data-lucide="send" class="w-5 h-5"></i>
                  </button>
                </div>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    // Initialize icons
    lucide.createIcons();

    // Config panel collapse
    (function() {
      const panel = document.getElementById('config-panel');
      const toggle = document.getElementById('config-toggle');
      const body = document.getElementById('config-body');
      let open = true;

      toggle.addEventListener('click', function() {
        open = !open;
        if (open) {
          panel.classList.remove('w-0', 'opacity-0');
          panel.classList.add('w-[260px]');
          body.classList.remove('hidden');
          toggle.setAttribute('aria-label', '收起配置');
          toggle.innerHTML = '<i data-lucide="panel-left-close" class="w-4 h-4"></i>';
        } else {
          panel.classList.remove('w-[260px]');
          panel.classList.add('w-0', 'opacity-0');
          body.classList.add('hidden');
          toggle.setAttribute('aria-label', '展开配置');
          toggle.innerHTML = '<i data-lucide="panel-left-open" class="w-4 h-4"></i>';
        }
        lucide.createIcons();
      });
    })();
  </script>
</body>
</html>
